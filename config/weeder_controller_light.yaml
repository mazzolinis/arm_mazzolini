controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

joint_trajectory_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
    gains:
      joint1:
        p: 20.0
        i: 0.0
        d: 1.9
        ff_velocity_scale: 0.0
      joint2:
        p: 10.0
        i: 0.0
        d: 1.5
        ff_velocity_scale: 0.0
    # constraints: 
    #   goal_time: 5.0

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["front_left_wheel_joint", "rear_left_wheel_joint"]
    right_wheel_names: ["front_right_wheel_joint", "rear_right_wheel_joint"]
    
    wheel_separation: 1.0
    wheel_separation_multiplier: 1.0
    wheel_radius: 0.2
    wheels_per_side: 2

    cmd_vel_timeout: 0.5
    pose_reference_frame: "odom"
    odom_frame_id: "odom"
    base_frame_id: "base_link"
    enable_odom_tf: true

    use_stamped_vel: false # Change when using nodes to publish messages
    open_loop: true

    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.010]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.010]

kinematic_node:
  ros__parameters:
    link1_length: 0.190
    link2_length: 0.250

    arm_base_to_DH:
      translation: [0.19, 0.0, 0.07] # [x, y, z] (meters)
      rotation: [0.0, 0.0, 0.0] # [yaw, pitch, roll] (degrees)
      
weeder_controller:
  ros__parameters:
    link1_length: 0.190
    link2_length: 0.250
    trajectory_time_ms: 250  # time in milliseconds to execute the trajectory
    tf_callback_period: 100  # milliseconds between each tf callback
    image_buffer_size: 3 # averaging target position of these many images
    frames_delay: 6 # checks the above amount of images and then idle for these many
    camera_rgb_topic: /simulated_D435/image_rect
    camera_depth_topic: /simulated_D435/depth_image
    camera_info_topic: /simulated_D435/camera_info
    roi_size: 5
    morph_kernel_size: 5
    depth_roi_size: 5
    mask_type: ExG_threshold # options: HSV_red, ExG_threshold, ExG_Otsu, ExGR. Default: HSV_red

    visual_servoing:
      filtering: false
      alpha: [1.0, 1.0, 0.4] # for target_camera_position (1.0 = no filtering)
      beta: [0.6, 0.6, 0.6] # for error [dx, dy, dz] (1.0 = no filtering)
      lambda: [0.8, 0.8, 0.4] # controller gain (it's not a filter option, it's always active)
      pcontroller_period_ms: 100 # (called dt in the node) remeber 0.0 < lambda*dt < 2.0 for stbility
      smoothing: 1.2 # 1.0 - 1.5 = trajectories are slower than control, if < 1.0 faster trajectories, possibile jerk
      control_threshold: 0.005 # stop condition for visual servoing (meters)
      desired_camera_position: [0.1, -0.1, 0.8] # in camera frame (meters)

